[package]
name = "sharper"
version = "0.3.0-prealpha.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Language-agnostic LSP feedback and rule verification for coding agents through MCP"
repository = "https://github.com/adrian13579/sharper"
readme = "README.md"
default-run = "sharper"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
notify = "8"
process-wrap = { version = "10", features = ["tokio1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "fake-lsp"
path = "tests/fixtures/fake_lsp.rs"
test = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
