name: Tests
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.gitattributes'
      - '.github/workflows/build.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.gitattributes'
      - '.github/workflows/build.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to validate
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lint all runtime and test targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build controlled LSP fixture
        run: cargo build --locked --example fake-lsp
      - name: Test runtime behavior and MCP executable
        run: cargo test --locked --lib --test core --test mcp -- --test-threads=4
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - name: Test npm launcher and release policy
        if: runner.os == 'Linux'
        run: node --test packaging/npm/test/launcher.test.cjs tests/release.test.mjs
  real-servers:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/language-tools/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'
      - run: npm ci --prefix tests/language-tools --ignore-scripts
      - name: Install qualification server
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'sharper-roslyn'
          dotnet tool install --tool-path $tools roslyn-language-server --version 5.13.0-1.26514.10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = if ($IsWindows) { 'roslyn-language-server.exe' } else { 'roslyn-language-server' }
          $server = Get-ChildItem -LiteralPath $tools -Recurse -File -Filter $name | Select-Object -First 1 -ExpandProperty FullName
          if (-not $server) { throw 'Official server executable not found' }
          "SHARPER_TEST_ROSLYN=$server" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHARPER_TEST_NODE_TOOLS=$((Resolve-Path tests/language-tools).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run explicitly enabled real server tests
        run: cargo test --locked --test real_servers -- --ignored --test-threads=1
