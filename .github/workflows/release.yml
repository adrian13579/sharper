name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Validate release version and notes
      shell: pwsh
      run: |
        $project = [xml](Get-Content src/SharpLint.Cli/SharpLint.Cli.csproj -Raw)
        $version = $project.Project.PropertyGroup.Version
        if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match the project version.' }
        if (-not (Test-Path -LiteralPath "docs/release-notes/$($env:RELEASE_TAG).md")) { throw 'Release notes are required.' }
    - name: Build Debug integration entry points
      shell: pwsh
      run: ./build.ps1
    - name: Check PowerShell wrappers
      shell: pwsh
      run: ./tests/scripts/Test-PowerShellScripts.ps1
    - name: Test MCP routing and Copilot setup on Windows
      if: runner.os == 'Windows'
      run: dotnet test SharpLint.slnx --no-build -m:1 --filter "FullyQualifiedName~CliTests|FullyQualifiedName~AgentWorkflowTests"
    - name: Install tested Roslyn language server
      if: runner.os == 'Linux'
      run: dotnet tool install --tool-path "$RUNNER_TEMP/roslyn" roslyn-language-server --version 5.13.0-1.26514.10
    - name: Test with real Roslyn and MCP
      if: runner.os == 'Linux'
      env:
        SHARPLINT_TEST_ROSLYN: ${{ runner.temp }}/roslyn/roslyn-language-server
      run: dotnet test SharpLint.slnx --no-build -m:1
    - name: Pack the tool
      run: dotnet pack src/SharpLint.Cli -c Release -o artifacts/packages -p:ContinuousIntegrationBuild=true
    - name: Install and exercise the packaged tool
      shell: pwsh
      run: ./tests/scripts/Test-ToolPackage.ps1
    - uses: actions/upload-artifact@v4
      with:
        name: sharplint-package-${{ runner.os }}
        path: artifacts/packages/*.nupkg
        if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@v4
      with:
        name: sharplint-package-Linux
        path: artifacts/packages
    - name: Check NuGet account configuration
      env:
        NUGET_USER: ${{ vars.NUGET_USER }}
      run: |
        if [ -z "$NUGET_USER" ]; then
          echo 'Set the NUGET_USER repository variable to the NuGet.org profile username.' >&2
          exit 1
        fi
    - name: Authenticate to NuGet with OIDC
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Publish the NuGet tool
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push artifacts/packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
    - name: Publish to GitHub Packages
      env:
        GH_PACKAGES_TOKEN: ${{ github.token }}
      run: |
        umask 077
        github_packages_config=$(mktemp "$RUNNER_TEMP/github-packages.XXXXXX.config")
        trap 'rm -f "$github_packages_config"' EXIT
        printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$github_packages_config"
        dotnet nuget add source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
          --name github --username "$GITHUB_ACTOR" --password "$GH_PACKAGES_TOKEN" \
          --store-password-in-clear-text --configfile "$github_packages_config"
        dotnet nuget push artifacts/packages/*.nupkg --source github \
          --configfile "$github_packages_config" --api-key "$GH_PACKAGES_TOKEN" --skip-duplicate
    - name: Verify GitHub package repository association
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for attempt in 1 2 3 4 5 6; do
          if gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/nuget/sharplint" > "$RUNNER_TEMP/github-package.json" \
            && jq -e --arg repo "$GITHUB_REPOSITORY" '.repository.full_name == $repo' "$RUNNER_TEMP/github-package.json" >/dev/null; then
            break
          fi
          sleep 5
        done
        jq -e --arg repo "$GITHUB_REPOSITORY" '.repository.full_name == $repo' "$RUNNER_TEMP/github-package.json"
        jq '{name, html_url, visibility, repository: .repository.full_name}' "$RUNNER_TEMP/github-package.json"
        gh api --paginate "users/${GITHUB_REPOSITORY_OWNER}/packages/nuget/sharplint/versions" \
          | jq -se --arg version "${RELEASE_TAG#v}" 'add | any(.[]; .name == $version)'
        jq -r '"Published [" + .name + "](" + .html_url + ") linked to " + .repository.full_name + ". Visibility: " + .visibility + "."' \
          "$RUNNER_TEMP/github-package.json" >> "$GITHUB_STEP_SUMMARY"
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          echo "GitHub release $RELEASE_TAG already exists."
          exit 0
        fi
        gh release create "$RELEASE_TAG" artifacts/packages/*.nupkg \
          --verify-tag --prerelease=false --latest --title "Sharplint ${RELEASE_TAG#v}" \
          --notes-file "docs/release-notes/$RELEASE_TAG.md"
