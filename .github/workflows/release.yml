name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate tag, changelog and release policy
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release.mjs
  tests:
    needs: validate
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  native:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publish:
    needs: [tests, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
      - name: Assemble the complete npm package
        run: node scripts/package-npm.mjs --windows artifacts/native/native-win-x64/sharper.exe --linux artifacts/native/native-linux-x64/sharper --output artifacts/npm
      - name: Publish npm using trusted publishing
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm publish artifacts/npm/*.tgz --access public --provenance --tag next
          else
            npm publish artifacts/npm/*.tgz --access public --provenance
          fi
