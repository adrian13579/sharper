name: Build
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.gitattributes'
      - '.github/workflows/build.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.gitattributes'
      - '.github/workflows/build.yml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to validate
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            app: sharper
            package-flag: --linux
          - os: windows-latest
            platform: win-x64
            app: sharper.exe
            package-flag: --windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/mcp-client/package-lock.json
      - name: Build release executable
        run: cargo build --locked --release
      - name: Build controlled LSP fixture
        run: cargo build --locked --example fake-lsp
      - name: Check release host with the official MCP SDK
        shell: pwsh
        run: |
          $env:SHARPER_TEST_HOST = (Resolve-Path 'target/release/${{ matrix.app }}').Path
          npm ci --prefix tests/mcp-client --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/mcp-client/smoke.mjs
      - name: Package and check the installed npm command
        shell: pwsh
        run: |
          node scripts/package-npm.mjs ${{ matrix.package-flag }} 'target/release/${{ matrix.app }}' --allow-partial --output artifacts/npm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-package.mjs
      - uses: actions/upload-artifact@v4
        if: inputs.ref != ''
        with:
          name: native-${{ matrix.platform }}
          path: target/release/${{ matrix.app }}
          if-no-files-found: error
          retention-days: 3
